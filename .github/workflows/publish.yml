name: Publish a build to nightly-bin

# Copies the FleetCombo-windows artifact of an earlier run to the "nightly-bin" branch, so it can be fetched with
# plain git. build.yml does this for every new build; this is for runs made before that step existed.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id of the build to publish
        required: true

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FleetCombo-windows
          path: FleetCombo
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to nightly-bin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd FleetCombo
          git init -q -b nightly-bin
          git config user.name "fleet-combo-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "FleetCombo build ${{ inputs.run_id }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" nightly-bin
